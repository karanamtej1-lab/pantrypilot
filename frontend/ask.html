<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ask.pageTitle">Ask · PantryPilot</title>
  <meta name="description" content="Ask questions about SNAP, WIC, school meals, and food pantries in English or Spanish.">
  <meta name="theme-color" content="#2c6e63">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ask.css">
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
</head>
<body class="ask-page">
  <header class="topbar">
    <div class="brand-row">
      <div class="brand">
        <h1 data-i18n="ask.title">Ask PantryPilot</h1>
        <p data-i18n="ask.tagline">Food help questions in English or Spanish</p>
      </div>
      <div id="prefs" class="prefs"></div>
    </div>
  </header>

  <main class="chat" id="main">
    <section class="card intro" id="intro" aria-labelledby="try-asking">
      <p data-i18n-html="ask.intro"><strong>I answer only from trusted sources</strong> and show you where each answer came from.</p>

      <h2 id="try-asking" data-i18n="ask.tryAsking">Try asking</h2>
      <div class="starters" id="starters"></div>
    </section>

    <ol id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"
        data-i18n-attr="aria-label:ask.conversation"></ol>
  </main>

  <form id="composer" class="composer">
    <label for="question" class="visually-hidden" data-i18n="ask.questionLabel">Your question</label>
    <textarea id="question" rows="1" maxlength="500" required aria-describedby="composer-note"
              placeholder="Ask a question" data-i18n-attr="placeholder:ask.placeholder"></textarea>
    <button type="submit" id="send" class="send" aria-label="Send question" data-i18n-attr="aria-label:ask.send; title:ask.send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="composer-note" id="composer-note" data-i18n="ask.note">Please don't type your name, case number, or SSN.</p>
  </form>

  <nav class="bottom-nav" aria-label="Main" data-i18n-attr="aria-label:nav.label">
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span data-i18n="nav.map">Map</span>
    </a>
    <a href="ask.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>
      <span data-i18n="nav.ask">Ask</span>
    </a>
    <a href="hours.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="nav.hours">Hours</span>
    </a>
  </nav>

  <script src="ask.js"></script>
</body>
</html>
